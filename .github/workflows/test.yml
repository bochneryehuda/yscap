name: tests

# The safety net. Runs the incident-derived test suites + the migration-number
# gate on every pull request and every push to main. These suites need no
# database, no env, and no network — they load the sync modules and exercise
# them with pure-function assertions and light stubs, so CI is fast (~1 min,
# dominated by checkout of the committed bundles).
#
# On a push to main, once tests pass, the `deploy` job below auto-publishes the
# site to Render so "merged to main" and "live" can never drift apart again
# (the recurring "fixed in code but still broken on the site" gap).
#
# NOTE: the whole project lives in the nested yscap-repo-root_8/ folder (not the
# git root), so every step runs with working-directory set there.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yscap-repo-root_8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: yscap-repo-root_8/package-lock.json
      - run: npm ci
      - run: npm test

  # ---------------------------------------------------------------------------
  # Same suite against a REAL Postgres (task #195). Every *-db.js suite that
  # self-skips without DATABASE_URL actually runs here: migrations apply to a
  # fresh database first (schema.sql + every numbered db/*.sql — so this job
  # also proves the migration chain itself), then the full chain runs with the
  # DB present. This job IS a deploy gate: after its soak went green it was added
  # to `deploy: needs:` (see the deploy job below), so a DB-layer regression now
  # blocks the auto-publish exactly like a pure-suite failure.
  # ---------------------------------------------------------------------------
  test-db:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: yscap-repo-root_8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: yscap
          POSTGRES_PASSWORD: yscap
          POSTGRES_DB: yscap_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yscap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://yscap:yscap@localhost:5432/yscap_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: yscap-repo-root_8/package-lock.json
      - run: npm ci
      - name: Apply every migration to the fresh database
        run: npm run migrate
      - run: npm test

  # ---------------------------------------------------------------------------
  # Auto-publish to Render. Runs ONLY:
  #   • after `test` succeeds (needs: test) — broken code never auto-deploys, and
  #   • on a push to main (never on a pull_request or any other branch).
  # It POSTs to a Render Deploy Hook whose secret URL lives in the repo secret
  # RENDER_DEPLOY_HOOK_URL (Settings → Secrets and variables → Actions). The URL
  # is never committed. If the secret is unset the job SKIPS with a clear notice
  # instead of failing, so this workflow is safe to merge before the hook exists.
  # Render's own health check (/api/health) still gates the actual go-live, so a
  # deploy that boots unhealthy is not switched into production.
  #
  # THREE SERVICES, NOT ONE (2026-08-03). This job published only the WEB service,
  # so the two BACKUP CRON services (ys-capital-backup, ys-capital-backup-verify)
  # never received a merged fix: their Auto-Deploy is Off in the dashboard by
  # design — a nightly job must not redeploy itself mid-run — and nothing else
  # triggered them. That is not hypothetical. PR #973 fixed `PG_MAJOR=17` against
  # a PostgreSQL 18.4 server, a defect that would have stopped every backup dead;
  # it landed on main and the running images kept whatever pg_dump they were last
  # manually built with. A backup job silently running month-old code is the exact
  # failure this whole system exists to prevent, so "merged to main" now reaches
  # the backup jobs too.
  #
  # Each hook is INDEPENDENT and OPTIONAL: an unset secret skips with a notice
  # (same contract as the web hook), and one service failing to deploy does not
  # stop the others being asked — the loop records the failure and fails the job
  # at the end, so a broken backup hook is loud without also blocking the site.
  # ---------------------------------------------------------------------------
  deploy:
    # test-db added 2026-07-23 after its soak went green (task #195): a DB-layer
    # regression now blocks the deploy exactly like a pure-suite failure.
    needs: [test, test-db]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploys
        env:
          # The website.
          HOOK_WEB: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          # The nightly off-site backup (Docker cron, Dockerfile.backup).
          HOOK_BACKUP: ${{ secrets.RENDER_BACKUP_DEPLOY_HOOK_URL }}
          # The weekly restore drill (same image, different command).
          HOOK_BACKUP_VERIFY: ${{ secrets.RENDER_BACKUP_VERIFY_DEPLOY_HOOK_URL }}
        run: |
          set -u
          failed=0
          triggered=0

          publish() {
            name="$1"; secret_name="$2"; hook="$3"
            if [ -z "$hook" ]; then
              echo "::notice::$secret_name is not set — skipping $name."
              echo "  Add it under Settings → Secrets and variables → Actions to publish $name automatically."
              return 0
            fi
            echo "Asking Render to publish $name…"
            code=$(curl -sS --retry 4 --retry-all-errors --max-time 30 \
                   -w '%{http_code}' -o /tmp/render_resp.json -X POST "$hook" || echo "000")
            echo "  Render responded HTTP $code"
            cat /tmp/render_resp.json 2>/dev/null || true
            echo ""
            case "$code" in
              200|201|202) echo "::notice::$name deploy triggered successfully."; triggered=$((triggered+1)) ;;
              *) echo "::error::$name deploy hook failed (HTTP $code)."; failed=$((failed+1)) ;;
            esac
          }

          echo "Tests passed on main — publishing…"
          publish "the website"          "RENDER_DEPLOY_HOOK_URL"                "$HOOK_WEB"
          publish "the nightly backup"   "RENDER_BACKUP_DEPLOY_HOOK_URL"         "$HOOK_BACKUP"
          publish "the weekly restore drill" "RENDER_BACKUP_VERIFY_DEPLOY_HOOK_URL" "$HOOK_BACKUP_VERIFY"

          echo "Deploys triggered: $triggered; failed: $failed"
          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed Render deploy hook(s) failed — see above."
            exit 1
          fi
