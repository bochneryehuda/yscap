name: tests

# The safety net. Runs the incident-derived test suites + the migration-number
# gate on every pull request and every push to main. These suites need no
# database, no env, and no network — they load the sync modules and exercise
# them with pure-function assertions and light stubs, so CI is fast (~1 min,
# dominated by checkout of the committed bundles).
#
# On a push to main, once tests pass, the `deploy` job below auto-publishes the
# site to Render so "merged to main" and "live" can never drift apart again
# (the recurring "fixed in code but still broken on the site" gap).
#
# NOTE: the whole project lives in the nested yscap-repo-root_8/ folder (not the
# git root), so every step runs with working-directory set there.

on:
  pull_request:
  push:
    branches: [main]
  # THE FULL SUITE, ON A CLOCK (owner-directed 2026-08-16: "another full test
  # all the time again and again").
  #
  # A pull request may run a reduced plan. There are now THREE counterweights,
  # and the first one already existed:
  #   1. EVERY MERGE TO MAIN runs the whole suite — that is the `push` trigger
  #      above, and it is what actually gates the deploy. Nothing reaches a
  #      borrower without all 897 steps passing.
  #   2. THIS nightly run catches what a per-change run structurally cannot: a
  #      flaky test, a vendor or dependency that changed underneath us, and
  #      anything time-dependent.
  #   3. `workflow_dispatch` — one button, full suite, any time.
  #
  # WHY NIGHTLY AND NOT HOURLY, stated plainly because it is a cost decision:
  # the database job takes ~20 minutes, so every 3 hours would be ~200 minutes
  # a day of private-repo Actions time and would exhaust a 2,000-minute monthly
  # allowance in about ten days. Nightly plus every-merge gives the same safety
  # for a fraction of that. Change the cron here to go more often.
  #
  # THE HOUR IS CHOSEN FROM THIS REPO'S OWN RUN HISTORY, not from "night". The
  # observed push window is 05:00-07:30 UTC — the busiest stretch there is, when
  # several agents are working at once — so a nightly at 07:00 would take two
  # runners for ~20 minutes in direct competition with live pull requests, which
  # is the queue problem the concurrency block above exists to relieve. 09:30 UTC
  # is outside it. Minute :30 also avoids :00, GitHub's most contended slot
  # (scheduled runs are best-effort and are dropped under load).
  schedule:
    - cron: '30 9 * * *'    # 09:30 UTC — outside this repo's observed busy window
  workflow_dispatch:

# ---------------------------------------------------------------------------
# STOP SUPERSEDED PULL-REQUEST RUNS FROM HOLDING THE QUEUE (owner-reported
# 2026-08-16: runs queue one after another and slow everything down when
# several changes are in flight at once).
#
# There was no concurrency group at all, so pushing four times to one branch
# started four full runs and the first three KEPT RUNNING to the end — burning
# runner capacity to test commits nobody will ever merge. With several agents
# working at once that is what fills the queue. Now only the newest commit on a
# branch runs; the older ones are cancelled the moment they are superseded.
#
# MAIN IS NEVER CANCELLED, AND THAT IS THE WHOLE CARE HERE. Keying the group on
# `run_id` for anything that is not a pull request gives every push to main its
# own group, so one main run can never cancel another — and cancel-in-progress
# is switched off there outright. A cancelled main run would mean a cancelled
# DEPLOY, which is the "merged but never published" failure this workflow was
# written to close.
#
# A cancelled PR run belongs to a commit that has already been replaced, so no
# required check is left waiting: the new commit reports its own fresh result.
# ---------------------------------------------------------------------------
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yscap-repo-root_8
    steps:
      # fetch-depth: 0 so the changed-file diff below has a real base to compare
      # against. A shallow clone cannot see the merge base, and a diff that
      # cannot be computed falls back to running EVERYTHING (see below) — so
      # this only ever costs speed, never coverage.
      - uses: actions/checkout@v4
        with:
          # Full history so the changed-file diff below has a real merge base;
          # `blob:none` fetches the COMMIT GRAPH without historical file
          # contents, which is all a `--name-only` diff needs. Measured on this
          # repo: plain `fetch-depth: 0` cost +27s per job (3s -> 31s) against a
          # 292 MiB pack; the filter recovers nearly all of it. A diff that
          # cannot be computed still falls back to running EVERYTHING, so this
          # only ever costs speed, never coverage.
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: yscap-repo-root_8/package-lock.json
      - run: npm ci

      # ---- what changed? (pull requests only) --------------------------------
      # Writes one path per line, relative to the git root. EVERY failure path
      # here leaves the file absent or empty, and `ci-scope.js` answers
      # "everything" for both — so a broken diff makes CI slower, never weaker.
      - name: Work out what changed
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          cd "$GITHUB_WORKSPACE"
          # BASE_REF ARRIVES THROUGH env, NEVER INTERPOLATED INTO THE SCRIPT.
          # Git ref names permit `$`, a backtick and `"`, so pasting one into a
          # shell line is a template-injection seam. It needs push access to
          # this repo to exploit, which makes it low-risk and free to close.
          base="origin/$BASE_REF"
          git fetch --no-tags origin "$BASE_REF" || exit 0
          git diff --name-only "$base"...HEAD > /tmp/changed-files.txt || rm -f /tmp/changed-files.txt
          echo "changed files:"; cat /tmp/changed-files.txt 2>/dev/null || echo "  (could not be determined — the full suite will run)"

      # ---- a quiet change to something load-bearing is made loud -------------
      # Plan §8.2 asked for CODEOWNERS here. It cannot work in this repository:
      # every pull request is authored by the owner's own account and GitHub
      # never requests a review from a pull request's author, so the rule would
      # be a control incapable of acting. This does the job the plan wanted
      # through a mechanism that functions with one account. Advisory always.
      - name: Name anything load-bearing this change touches
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: node scripts/check-guarded-paths.js --changed-from /tmp/changed-files.txt

      # ---- the suite --------------------------------------------------------
      # A PULL REQUEST MAY RUN A REDUCED PLAN — and it is not only Long-Term
      # changes. `ci-test-plan.js` has TWO selectors: the Long-Term rule (~29
      # steps), and a MEASURED IMPACT MAP that narrows ANY pull request to the
      # tests recorded as able to reach the changed files (a pricing change runs
      # ~210 of 925). Saying "Long-Term-only" here was simply wrong, and this
      # file is where somebody looks to answer "is my PR fully tested?".
      #
      # THE GUARANTEE IS UNCHANGED AND IS THE ONLY ONE THAT MATTERS: a PUSH TO
      # MAIN always runs the whole thing, because that is what gates the deploy.
      # Nothing is ever left unrun — a step skipped on a PR still runs there
      # before anything is published. A change to the selector, to the step list
      # or to this workflow always runs everything, and any file the map has
      # never seen does too.
      - name: Run the tests
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ -s /tmp/changed-files.txt ]; then
            npm run test:changed -- --changed-from /tmp/changed-files.txt
          else
            npm test
          fi

  # ---------------------------------------------------------------------------
  # Same suite against a REAL Postgres (task #195). Every *-db.js suite that
  # self-skips without DATABASE_URL actually runs here: migrations apply to a
  # fresh database first (schema.sql + every numbered db/*.sql — so this job
  # also proves the migration chain itself), then the full chain runs with the
  # DB present. This job IS a deploy gate: after its soak went green it was added
  # to `deploy: needs:` (see the deploy job below), so a DB-layer regression now
  # blocks the auto-publish exactly like a pure-suite failure.
  # ---------------------------------------------------------------------------
  test-db:
    runs-on: ubuntu-latest
    # NO job-level timeout-minutes — deliberately. A JOB's clock starts when the
    # job is QUEUED, not when it gets a runner, so the old `timeout-minutes: 30`
    # here was spent waiting in line: on 2026-08-09 (main, sha f9cb8a17) this job
    # was cancelled at 28 minutes with `runner_id: 0` — it never received a runner
    # at all — which made `deploy` (needs: [test, test-db]) SKIP, so a green merge
    # silently stopped publishing to Render. That is the exact "fixed in code but
    # still broken on the site" gap this workflow exists to close.
    #
    # The hang protection it was there for now lives on the STEPS below, whose
    # clocks only count actual execution. Same safety, minus the queue time.
    #
    # NO `permissions:` BLOCK, DELIBERATELY. This job runs the whole test suite,
    # which is the most repository-controlled code in this build — it is the job
    # that should hold the least authority, not the most. The write grant needed
    # to commit a refreshed map lives in `schema-push` below, whose only inputs
    # are a checkout and an artifact.
    outputs:
      schema_stale: ${{ steps.schema_map.outputs.stale }}
    defaults:
      run:
        working-directory: yscap-repo-root_8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: yscap
          POSTGRES_PASSWORD: yscap
          POSTGRES_DB: yscap_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yscap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://yscap:yscap@localhost:5432/yscap_test
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the changed-file diff below has a real merge base;
          # `blob:none` fetches the COMMIT GRAPH without historical file
          # contents, which is all a `--name-only` diff needs. Measured on this
          # repo: plain `fetch-depth: 0` cost +27s per job (3s -> 31s) against a
          # 292 MiB pack; the filter recovers nearly all of it. A diff that
          # cannot be computed still falls back to running EVERYTHING, so this
          # only ever costs speed, never coverage.
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: yscap-repo-root_8/package-lock.json
      - run: npm ci

      # THE FULL MIGRATION CHAIN ALWAYS RUNS, in every mode, on every event.
      # A Long-Term migration is the one genuine coupling between the two
      # products — every db/*.sql runs on boot for BOTH — so a broken
      # `db/NNN_lt_*.sql` could stop the short-term system booting. Selecting
      # tests must never mean selecting migrations.
      - name: Apply every migration to the fresh database
        run: npm run migrate
        timeout-minutes: 15

      # ---- refresh the schema map, from the database these migrations built ---
      #
      # This job is the ONE place a database built from THIS checkout's
      # migrations always exists, for free — so it is the one place the map can
      # be brought up to date with no setup at all. Refreshing it by hand means
      # finding a Postgres, applying 550 migrations and pointing DATABASE_URL at
      # the result; here that has already happened, one step above.
      #
      # IT RUNS BEFORE THE SUITE, AND THAT ORDER IS THE WHOLE CORRECTNESS OF IT.
      # The first version of this step ran LAST and was wrong: ~900 tests write
      # to this database, several of them leaving schema objects behind, so the
      # map it produced described a database nobody has — and it duly reported
      # "stale" on a map that was in fact exact (observed, run 31931128520).
      # Right here the database is precisely what the migrations build, which is
      # the only thing the committed map is ever supposed to describe.
      #
      # IT WRITES TO A SCRATCH DIRECTORY, NEVER docs/schema/. Overwriting the
      # committed map would leave `check-schema-snapshot.js` — which runs inside
      # the suite below — comparing files that had just been written from the
      # very database it is about to check them against: a guard that passes
      # always and guards nothing.
      #
      # IT WRITES NOTHING BACK TO THE REPOSITORY, deliberately. Committing from
      # CI would race the branch an agent is actively pushing to, and a
      # force-push would silently drop the refresh while everyone believed it
      # was automatic — a stale map nobody is watching any more is worse than
      # one nobody is watching yet. The corrected files are attached to the run
      # instead, so the fix is a download.
      #
      # ADVISORY on every path: `continue-on-error` and a `|| exit 0` so an
      # unreachable database or a broken snapshot script can never turn a green
      # run red.
      - name: Refresh the schema map (advisory)
        id: schema_map
        continue-on-error: true
        timeout-minutes: 5
        run: |
          rm -rf /tmp/schema-refresh && mkdir -p /tmp/schema-refresh
          # THE WHOLE MAP, NOT ONE FILE OF IT. The picture is derived from the
          # inventory and the schema header QUOTES it, so regenerating only the
          # inventory produces a set that disagrees with itself — and the
          # `schema:restamp` half is exactly what `check-schema-behind` had to
          # start advising people to run after following its own advice broke
          # their build. `schema.prisma` is copied in FIRST because a restamp
          # rewrites only the header and REFUSES a file it cannot find a body
          # in; that refusal is what stops it writing a bare seed over the
          # models. `prisma db pull` is deliberately NOT run here — it needs
          # Prisma's native engines, which this build does not install.
          cp docs/schema/schema.prisma /tmp/schema-refresh/ 2>/dev/null || true
          # SAY SO WHEN IT FAILS. `|| exit 0` keeps this advisory, but on its own
          # it makes a permanently-broken refresh indistinguishable from a clean
          # one: green step, `stale` never set, artifact skipped, nobody told.
          SCHEMA_OUT_DIR=/tmp/schema-refresh node scripts/schema-snapshot.js \
            || { echo "::warning::the advisory schema refresh could not run — the map was not checked this run"; exit 0; }
          SCHEMA_OUT_DIR=/tmp/schema-refresh node scripts/schema-picture.js \
            || { echo "::warning::the schema picture could not be regenerated — the map was not refreshed this run"; exit 0; }
          SCHEMA_OUT_DIR=/tmp/schema-refresh node scripts/schema-prisma.js --restamp \
            || { echo "::warning::the schema map header could not be restamped — the map was not refreshed this run"; exit 0; }
          if diff -q /tmp/schema-refresh/beyond-prisma.json docs/schema/beyond-prisma.json >/dev/null 2>&1; then
            echo "The committed schema map matches the database these migrations build."
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "::warning::The committed schema map does not match the database these migrations build. A refreshed copy is attached to this run as the 'schema-map' artifact. On a pull request from this repository the next job commits it back automatically; otherwise download it and commit docs/schema/."
            node scripts/check-schema-behind.js || true
          fi

      # Only when it is actually out of date. Uploading 1 MB on every run to
      # hand back a byte-identical copy of what is already committed is storage
      # spent to say nothing.
      - name: Attach the refreshed schema map
        if: always() && steps.schema_map.outputs.stale == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: schema-map
          path: /tmp/schema-refresh/
          if-no-files-found: ignore
          retention-days: 14

      - name: Work out what changed
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          cd "$GITHUB_WORKSPACE"
          # BASE_REF ARRIVES THROUGH env, NEVER INTERPOLATED INTO THE SCRIPT.
          # Git ref names permit `$`, a backtick and `"`, so pasting one into a
          # shell line is a template-injection seam. It needs push access to
          # this repo to exploit, which makes it low-risk and free to close.
          base="origin/$BASE_REF"
          git fetch --no-tags origin "$BASE_REF" || exit 0
          git diff --name-only "$base"...HEAD > /tmp/changed-files.txt || rm -f /tmp/changed-files.txt
          echo "changed files:"; cat /tmp/changed-files.txt 2>/dev/null || echo "  (could not be determined — the full suite will run)"

      # Same rule as the pure job: a pull request may run a reduced plan when
      # the change is provably Long-Term-only; a push to main always runs the
      # whole suite, because that is what gates the deploy.
      #
      # 45, NOT 30 — MEASURED (owner-directed 2026-08-20). The cap had stopped
      # being a hang guard and become a stopwatch the suite races. The WHOLE
      # suite is what a package.json change forces on a pull request — so, any
      # change that adds a test step — and it is what every push to main runs.
      # On main at 75e4470 this step took 25m42s of the old 30-minute cap: 86%
      # of it, which is inside ordinary runner-to-runner variance. It crossed
      # the line the same day, and the shape of that failure is the argument:
      # the step was killed with 26 of 1106 steps left, i.e. 97.6% of the suite
      # had already PASSED. A cap that truncates a passing suite reports a
      # failure about the clock rather than the code, and the only reading it
      # invites is "just re-run it" — the exact habit the drive-to-green rules
      # refuse, and the one that eventually waves a real failure through.
      #
      # Raising it can never run LESS: nothing is skipped, quarantined, or made
      # advisory, and the hang protection is intact — the cap still kills a
      # wedged step, it just no longer kills a working one. Re-measure against
      # the real duration when the suite grows again.
      #
      # RE-MEASURED 2026-08-31, on the same symptom the note above describes.
      # Run 33410034143 was killed at 45 minutes having reached suite 1,382 of
      # 1,387 — 99.6% of a PASSING chain, with five suites left. The chain has
      # grown from 1,106 steps when 45 was chosen to 1,388 now, so the cap had
      # simply been overtaken: nothing had become slow, there was more of it.
      #
      # 60, not 46. The measured need is ~45.2 minutes, and a cap set a minute
      # above the measurement is a cap that fails on the next suite anybody
      # adds — which is how this note came to be written twice. 60 leaves ~33%
      # headroom and still kills a genuinely wedged step well inside the hour.
      #
      # ⛔ THE THIRD TIME (2026-09-02) WAS NOT THIS. Read the two notes above and
      # the reflex is to raise the cap again; it would have been wrong, and at 90
      # minutes it would have failed exactly the same way. The step was not slow.
      # IT WAS WEDGED — the hang guard doing its job, reported as a stopwatch.
      #
      # The measurement that separates them, and it takes one look at the log's
      # last lines rather than its duration: main bd73e12f ran this step in
      # 37m11s and PASSED; the very next commit, eb5b7978, was killed at 60. The
      # chain grew by ONE suite between them, which runs in 0.8s. The log tail is
      # the whole story — the chain reached scripts/test-draw-findings-public.js
      # SEVEN MINUTES IN, printed "14 passed, 0 failed", and then nothing for 53
      # minutes but a background heartbeat every 5 minutes. The ~1,300 suites
      # behind it never ran.
      #
      # WHY: Long-Term now warms its settings at require time and re-reads them
      # every 15s, which opens a connection on Long-Term's own pool. A suite that
      # ends by letting Node exit could not, because that socket was still open.
      # Fixed at the pool (`allowExitOnIdle`, src/longterm/db.js) and guarded by
      # scripts/test-lt-process-exits-db.js, which is placed SECOND in the chain
      # so the next one of these fails in the first minute instead of the sixtieth.
      #
      # SO: before touching this number again, read the last twenty lines of the
      # killed step. A chain that stopped early is a hang and raising the cap only
      # buys a longer wait; a chain that reached its last suites has genuinely
      # grown, and that is the case the two notes above are about.
      - name: Run the tests
        timeout-minutes: 60
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ -s /tmp/changed-files.txt ]; then
            npm run test:changed -- --changed-from /tmp/changed-files.txt
          else
            npm test
          fi

  # ---------------------------------------------------------------------------
  # Put the refreshed schema map back on the pull request that made it stale.
  #
  # WHY A SEPARATE JOB. This is the only job in the workflow that holds a write
  # grant, and it is deliberately tiny: a checkout, an artifact, and one script.
  # `test-db` regenerates the map but runs the whole test suite, so giving IT
  # `contents: write` would hand the repository-write permission to the job
  # executing the most repository-controlled code in the build.
  #
  # WHY THE PR BRANCH AND NOT MAIN. The map is a pure function of `db/*.sql` and
  # every migration arrives through a pull request, so fixing it here means main
  # is never stale and no bot ever writes to the trunk — which is what
  # Kubernetes, the Azure SDK and SLSA's source track each arrange in their own
  # way. Reasoning in `docs/SCHEMA-MAP-AUTO-REFRESH-RESEARCH.md`.
  #
  # It NEVER runs on a push to main, so it can never produce a commit on the
  # branch `deploy` watches. On main the refresh stays advisory: `test-db` warns
  # and attaches the artifact, and must not fail — `deploy` needs `test-db`, so
  # a stale map failing that job would block publishing over a docs file.
  # ---------------------------------------------------------------------------
  schema-push:
    # A FORK'S BRANCH IS NOT OURS TO WRITE TO, and the token cannot anyway — so
    # say so by not running, rather than failing every fork PR with a push error.
    if: >-
      github.event_name == 'pull_request'
      && needs.test-db.outputs.schema_stale == 'true'
      && github.event.pull_request.head.repo.full_name == github.repository
    needs: test-db
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: yscap-repo-root_8
    steps:
      # The PR's OWN branch, not the merge commit `pull_request` checks out by
      # default — committing onto a detached merge commit would push nothing
      # anybody can see. `persist-credentials` (the default) is what lets the
      # push below authenticate as GITHUB_TOKEN.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: schema-map
          path: /tmp/schema-refresh
      - name: Commit the refreshed schema map
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: node scripts/ci-schema-commit.js --from /tmp/schema-refresh --branch "$HEAD_REF"

  # ---------------------------------------------------------------------------
  # Auto-publish to Render. Runs ONLY:
  #   • after `test` succeeds (needs: test) — broken code never auto-deploys, and
  #   • on a push to main (never on a pull_request or any other branch).
  # It POSTs to a Render Deploy Hook whose secret URL lives in the repo secret
  # RENDER_DEPLOY_HOOK_URL (Settings → Secrets and variables → Actions). The URL
  # is never committed. If the secret is unset the job SKIPS with a clear notice
  # instead of failing, so this workflow is safe to merge before the hook exists.
  # Render's own health check (/api/health) still gates the actual go-live, so a
  # deploy that boots unhealthy is not switched into production.
  #
  # THREE SERVICES, NOT ONE (2026-08-03). This job published only the WEB service,
  # so the two BACKUP CRON services (ys-capital-backup, ys-capital-backup-verify)
  # never received a merged fix: their Auto-Deploy is Off in the dashboard by
  # design — a nightly job must not redeploy itself mid-run — and nothing else
  # triggered them. That is not hypothetical. PR #973 fixed `PG_MAJOR=17` against
  # a PostgreSQL 18.4 server, a defect that would have stopped every backup dead;
  # it landed on main and the running images kept whatever pg_dump they were last
  # manually built with. A backup job silently running month-old code is the exact
  # failure this whole system exists to prevent, so "merged to main" now reaches
  # the backup jobs too.
  #
  # The website uses its native deploy hook. Render exposes no deploy hook for
  # these manually-created cron jobs, so they use the authenticated Render API.
  # Every credential is required: a missing value fails this job loudly. One
  # service failure does not stop the others being attempted; failures are
  # collected and reported at the end.
  # ---------------------------------------------------------------------------
  deploy:
    # test-db added 2026-07-23 after its soak went green (task #195): a DB-layer
    # regression now blocks the deploy exactly like a pure-suite failure.
    needs: [test, test-db]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploys
        env:
          # The website has a native Render deploy hook.
          HOOK_WEB: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          # Render does not expose deploy hooks for these manually-created cron
          # jobs, so they use the authenticated deploy API instead.
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          BACKUP_SERVICE_ID: ${{ secrets.RENDER_BACKUP_SERVICE_ID }}
          BACKUP_VERIFY_SERVICE_ID: ${{ secrets.RENDER_BACKUP_VERIFY_SERVICE_ID }}
        run: |
          set -u
          failed=0
          triggered=0

          require_value() {
            name="$1"; value="$2"
            if [ -n "$value" ]; then
              return 0
            fi
            echo "::error::$name is not set — tested publishing is incomplete."
            failed=$((failed+1))
            return 1
          }

          publish_hook() {
            name="$1"; secret_name="$2"; hook="$3"
            require_value "$secret_name" "$hook" || return 0
            echo "Asking Render to publish $name…"
            code=$(curl -sS --retry 4 --retry-all-errors --max-time 30 \
                   -w '%{http_code}' -o /tmp/render_resp.json -X POST "$hook" || echo "000")
            echo "  Render responded HTTP $code"
            cat /tmp/render_resp.json 2>/dev/null || true
            echo ""
            case "$code" in
              200|201|202) echo "::notice::$name deploy triggered successfully."; triggered=$((triggered+1)) ;;
              *) echo "::error::$name deploy hook failed (HTTP $code)."; failed=$((failed+1)) ;;
            esac
          }

          publish_api() {
            name="$1"; service_secret="$2"; service_id="$3"
            require_value "RENDER_API_KEY" "$RENDER_API_KEY" || return 0
            require_value "$service_secret" "$service_id" || return 0
            echo "Asking Render to publish $name…"
            code=$(curl -sS --retry 4 --retry-all-errors --max-time 30 \
                   -w '%{http_code}' -o /tmp/render_resp.json -X POST \
                   -H "Authorization: Bearer $RENDER_API_KEY" \
                   -H 'Accept: application/json' \
                   -H 'Content-Type: application/json' \
                   --data '{"clearCache":"do_not_clear"}' \
                   "https://api.render.com/v1/services/$service_id/deploys" || echo "000")
            echo "  Render responded HTTP $code"
            cat /tmp/render_resp.json 2>/dev/null || true
            echo ""
            case "$code" in
              201|202) echo "::notice::$name deploy triggered successfully."; triggered=$((triggered+1)) ;;
              *) echo "::error::$name Render API deploy failed (HTTP $code)."; failed=$((failed+1)) ;;
            esac
          }

          echo "Tests passed on main — publishing…"
          publish_hook "the website" "RENDER_DEPLOY_HOOK_URL" "$HOOK_WEB"
          publish_api "the nightly backup" "RENDER_BACKUP_SERVICE_ID" "$BACKUP_SERVICE_ID"
          publish_api "the weekly restore drill" "RENDER_BACKUP_VERIFY_SERVICE_ID" "$BACKUP_VERIFY_SERVICE_ID"

          echo "Deploys triggered: $triggered; failed: $failed"
          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed Render deploy(s) failed — see above."
            exit 1
          fi
