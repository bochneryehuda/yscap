# Render Blueprint — REFERENCE CONFIGURATION, not the live wiring.
#
# READ THIS BEFORE TRUSTING THIS FILE:
#  1. Render only auto-applies a Blueprint named render.yaml at the GIT ROOT. This project lives in
#     the nested `yscap-repo-root_8/` folder (see CLAUDE.md), so this file is NOT at the git root
#     and Render does not apply it. Hence `rootDir:` on every service below — needed if this is
#     ever moved up and applied.
#  2. The live web service was created BY HAND in the dashboard, so its real settings are whatever
#     the dashboard says — not what is written here. Treat this file as the documented intent and
#     the checklist for creating a service, and change the dashboard when you change this.
# Adding the worker service therefore means creating it in the dashboard using the values below;
# merging this file does not create it.
services:
  - type: web
    name: ys-capital-portal
    runtime: node
    plan: starter
    rootDir: yscap-repo-root_8          # the project is nested — package.json lives here
    buildCommand: npm install && npm --prefix app ci && npm --prefix app run build
    startCommand: npm run start
    healthCheckPath: /api/health
    # Persistent disk for uploaded documents. Render's default filesystem is
    # ephemeral (wiped on every deploy); this volume survives deploys/restarts.
    # Note: a service with a disk runs a single instance (no horizontal scaling).
    disk:
      name: yscap-uploads
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: NODE_ENV
        value: production
      # Password hashing (scrypt) runs on libuv's threadpool so it never blocks
      # the event loop. Give it more than the default 4 threads so a burst of
      # concurrent logins doesn't queue up behind a small pool.
      - key: UV_THREADPOOL_SIZE
        value: "8"
      # Documents live in Cloudflare R2 (owner completed the cutover 2026-07-26). This MUST match
      # the worker service below: if the web service saved to local disk while the worker read from
      # R2, the worker would find nothing — the split-brain the shared object store exists to
      # prevent. The S3_* values are dashboard-only (secrets are never committed).
      - key: STORAGE_PROVIDER
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        value: auto
      # Kept as the dual-read fallback for documents saved BEFORE the R2 cutover: a read that
      # misses in the bucket falls back to this disk, so old files still download.
      - key: STORAGE_DIR
        value: /var/data/uploads
      # DATABASE_URL must point at your Postgres instance (named "yscap").
      # - Blueprint-managed services: the fromDatabase link below wires it
      #   automatically to the matching database in the `databases:` block.
      # - Manually-created services (render.yaml not applied): this file is
      #   ignored — you MUST set DATABASE_URL in the dashboard by hand, to the
      #   database's INTERNAL Database URL (same region) or External URL.
      # A wrong/unset value makes the app fall back to localhost and every DB
      # call fails with ECONNREFUSED 127.0.0.1:5432 (see logs) — set this first.
      - key: DATABASE_URL
        fromDatabase: { name: yscap, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: SSN_ENCRYPTION_KEY
        generateValue: true
      # Long-Term Lender Price read-only pricing. The browser login authenticates both
      # the borrower and the OAuth client; all four values are dashboard-only.
      - key: LP_USERNAME
        sync: false
      - key: LP_PASSWORD
        sync: false
      - key: LP_CLIENT_SECRET
        sync: false
      - key: LP_DIAG_TOKEN
        sync: false
      # FAIL CLOSED ON STALE PRICING CONFIGURATION. The connector clones the company's LIVE
      # defaultSearch + SMO registry for every pricing job and falls back to a captured static
      # model if either call fails. That fallback is a months-old snapshot: it can be accepted
      # upstream and still price a materially different loan, which does not error anywhere —
      # the 2026-08-16 audit measured 475 frontend rows against 752 from the fallback for one
      # matched scenario. With this set, pricing REFUSES (502 lp_foundation_not_live) rather
      # than quoting from it, and /api/lt/dscr/health reports pricingReady:false with the
      # reason. Left unset, pricing still works but health reports foundation.degraded:true —
      # it is never silent either way. NOT a secret; it is deployment policy, so it lives here
      # rather than only in the dashboard.
      - key: LP_REQUIRE_LIVE_FOUNDATION
        value: "1"
      # Trinity — the PHYSICAL inspection company we order draw inspections from on
      # files whose note buyer is NOT Blue Lake. Dashboard-only (never in source), and
      # the whole integration is INERT until the username + password are set: with no
      # credentials nothing is attempted, no order is placed and no poll runs.
      #
      # The three ON/OFF switches (TRINITY_ENABLED, TRINITY_OUTBOUND_ENABLED,
      # TRINITY_DRYRUN) are deliberately NOT listed here — they are flipped live on the
      # API Health page without a deploy, and an env value listed here would only be
      # their starting default.
      - key: TRINITY_USERNAME
        sync: false
      - key: TRINITY_PASSWORD
        sync: false
      # Production host. Leave unset to use the default (api.trinityonline.com); set it
      # only if Trinity gives us a different one for the live account.
      - key: TRINITY_BASE_URL
        sync: false
      # Trinity's webhooks carry NO signature, so the receiver authenticates on a secret
      # PATH token we choose and then re-reads every fact with an authenticated call.
      # Generated here so it is never typed by hand or pasted into a chat.
      - key: TRINITY_WEBHOOK_TOKEN
        generateValue: true
      - key: INTAKE_API_KEY
        generateValue: true
      # 'auto' picks the provider from whatever credentials are present:
      # set RESEND_API_KEY below and email turns on automatically. Force a
      # provider by setting this to resend|graph|none instead.
      - key: EMAIL_PROVIDER
        value: auto
      # Our emails ARE repliable, so the sender is a real monitored address, not
      # "no-reply" (owner-directed 2026-07-20). For Resend only the DOMAIN must be
      # verified; for Graph this must be a real mailbox UPN in the tenant.
      - key: NOTIFY_FROM
        value: PILOT by YS Capital <notifications@yscapgroup.com>
      # Guaranteed Reply-To when no per-file reply address applies — so hitting
      # "reply" on any notification always reaches a person.
      - key: REPLY_TO
        value: sales@yscapgroup.com
      # Base URL used for links inside emails (verify/reset) AND the email logo.
      # This is the live custom domain (owner-directed 2026-07-14) so every
      # notification link opens www.yscapgroup.com, not the onrender subdomain.
      # NOTE: if APP_URL is ALSO set in the Render dashboard it overrides this —
      # update it there too.
      - key: APP_URL
        value: https://www.yscapgroup.com
      # Paste your Resend API key in the dashboard (kept out of git). NOTIFY_FROM's
      # domain (yscapgroup.com) must be a verified domain in your Resend account.
      - key: RESEND_API_KEY
        sync: false
      # #68/#75 reply-by-email — full go-live steps in docs/EMAIL-REPLY-INBOX-SETUP.md.
      # CHAT_REPLY_DOMAIN: the verified Resend INBOUND domain (e.g. reply.yscapgroup.com).
      # RESEND_WEBHOOK_SECRET: the whsec_… signing secret of the Resend webhook that
      #   points at /api/inbound/file-email (the endpoint refuses everything without it).
      # RESEND_INBOUND_API_KEY: a FULL-ACCESS Resend key (reads received email bodies;
      #   optional if RESEND_API_KEY already has full access).
      - key: CHAT_REPLY_DOMAIN
        sync: false
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      - key: RESEND_INBOUND_API_KEY
        sync: false
      # Document underwriting: OCR reader (Azure AI Document Intelligence) + AI analyzer
      # (Azure OpenAI GPT-5). All secrets are dashboard-only (sync:false) — never
      # committed. The system stays dormant until the Azure endpoints + keys are set.
      - key: AZURE_DOCINT_ENDPOINT
        sync: false
      - key: AZURE_DOCINT_KEY
        sync: false
      - key: AZURE_DOCINT_API_VERSION
        value: "2024-11-30"
      - key: AZURE_OPENAI_ENDPOINT
        sync: false
      - key: AZURE_OPENAI_KEY
        sync: false
      - key: AZURE_OPENAI_DEPLOYMENT
        sync: false
      - key: AZURE_OPENAI_API_VERSION
        value: "2025-04-01-preview"
      # Fill these in the dashboard when you wire the rest:
      # NOTIFY_ADMINS, MS_TENANT_ID, MS_CLIENT_ID, MS_CLIENT_SECRET, CLICKUP_API_TOKEN
      # SharePoint one-way sync (Pipeline Drive mirror — docs/SHAREPOINT-POLICY.md):
      # SHAREPOINT_BACKUP_ENABLED=1, SHAREPOINT_DRIVE_ID, and optionally
      # MS_CLIENT_CERT_PEM_B64 (certificate auth, preferred over the secret).
      # The document reader runs as its OWN service (below), so the web service must
      # NOT also drain the queue — otherwise reading competes with borrower page loads
      # for this process, which is the whole problem the split fixes.
      - key: UW_WORKER_ENABLED
        value: "false"

  # ---------------------------------------------------------------------------
  # Pipeline V2 document reader — a SEPARATE service (owner defect #7).
  #
  # Same repo, same build, different entrypoint. It drains document_pipeline_jobs
  # and writes ONLY the V2 audit tables — it is ADVISORY and never writes a
  # condition, status, finding, or anything else on a real loan file.
  #
  # It deliberately has NO disk: documents live in Cloudflare R2 (STORAGE_PROVIDER=s3),
  # which is exactly what makes two services possible — both reach the same files.
  # If storage were still the web service's local disk, this service could not read
  # anything the web service saved.
  #
  # It does NOT run migrations: the web service owns the schema (src/worker.js waits
  # for the DB via waitForDb() without applying it). Two services racing the same
  # migration chain on a deploy is a real corruption hazard.
  # ---------------------------------------------------------------------------
  - type: worker
    name: ys-capital-pipeline-worker
    runtime: node
    plan: starter
    rootDir: yscap-repo-root_8          # the project is nested — package.json lives here
    buildCommand: npm install
    startCommand: npm run worker
    envVars:
      - key: NODE_ENV
        value: production
      # Same database as the web service.
      - key: DATABASE_URL
        fromDatabase: { name: yscap, property: connectionString }
      # THIS is the service that drains the queue.
      - key: UW_WORKER_ENABLED
        value: "true"
      # Shared object storage — the reason a second service can see the documents at
      # all. These must match the web service's values exactly; set them in the
      # dashboard (secrets are never committed).
      - key: STORAGE_PROVIDER
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        value: auto
      # Reading engines — same credentials as the web service (dashboard-only).
      - key: AZURE_DOCINT_ENDPOINT
        sync: false
      - key: AZURE_DOCINT_KEY
        sync: false
      - key: AZURE_DOCINT_API_VERSION
        value: "2024-11-30"
      # Pipeline switches. Shadow + advisory; UW_PIPELINE_V2_READ turns on real reading.
      - key: UW_PIPELINE_V2_ENABLED
        sync: false
      - key: UW_PIPELINE_V2_SHADOW
        sync: false
      - key: UW_PIPELINE_V2_FAMILIES
        sync: false
      - key: UW_PIPELINE_V2_READ
        sync: false
      # The shared config does NOT refuse a missing secret — it generates an ephemeral value and
      # prints a SECURITY warning on every boot. Set these so the worker's logs stay quiet and a
      # real warning is never lost in the noise. The worker verifies no tokens and decrypts nothing
      # today, so the values only need to exist.
      - key: SSN_ENCRYPTION_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
  # ---------------------------------------------------------------------------
  # NIGHTLY OFF-SITE BACKUP (owner-directed 2026-08-02).
  #
  # Render already keeps its own point-in-time backups of the database, and those are the FIRST
  # thing to reach for — they restore to any second in the recovery window with one click. What
  # they do not survive is the Render account itself: a billing lapse, a mistaken database
  # deletion noticed a week late, a compromised login. This job is the copy that lives somewhere
  # else entirely, encrypted with a key Render never sees.
  #
  # It is a CRON JOB, not a worker: it runs, does its work, and exits. Render bills the seconds.
  #
  # Runtime is DOCKER because the job needs pg_dump at a major version >= the database's, and the
  # native Node image does not guarantee one. See Dockerfile.backup.
  #
  # 07:10 UTC ≈ 3:10am New York — after the day's work, before anyone starts.
  # ---------------------------------------------------------------------------
  - type: cron
    name: ys-capital-backup
    runtime: docker
    plan: starter
    rootDir: yscap-repo-root_8
    dockerfilePath: ./Dockerfile.backup
    schedule: "10 7 * * *"
    dockerCommand: node scripts/backup-run.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: yscap, property: connectionString }
      # THE KEY. Generated once with `openssl rand -base64 32`, set in the dashboard, and kept in
      # the company password manager. Without it, every backup in the vault is unreadable — by an
      # attacker AND by us. It is the single most important value in this file.
      - key: BACKUP_ENCRYPTION_KEY
        sync: false
      # The vault: an S3-compatible bucket at a DIFFERENT provider than Render, in a DIFFERENT
      # account than the documents bucket, ideally with Object Lock turned on so a backup cannot
      # be deleted by anyone — including someone holding these credentials.
      - key: BACKUP_S3_BUCKET
        sync: false
      - key: BACKUP_S3_ENDPOINT
        sync: false
      - key: BACKUP_S3_ACCESS_KEY_ID
        sync: false
      - key: BACKUP_S3_SECRET_ACCESS_KEY
        sync: false
      - key: BACKUP_S3_REGION
        sync: false
      # WORM immutability. BLANK because the vault is Cloudflare R2 (owner-directed 2026-08-02):
      # R2 does not implement the S3 per-object Object Lock API, so a mode set here would send
      # x-amz-object-lock-* headers it rejects — and with no mode set, vault.js sends none at all.
      # R2 protects the bucket instead, via a 35-day BUCKET LOCK rule set in the Cloudflare
      # dashboard; keep that equal to BACKUP_KEEP_DAILY_DAYS so the nightly prune only ever
      # deletes objects whose lock has already expired. Set this to COMPLIANCE only if the vault
      # is moved to AWS S3 or Backblaze B2 (whose bucket must be CREATED with Object Lock on).
      - key: BACKUP_S3_OBJECT_LOCK_MODE
        value: ""
      - key: BACKUP_S3_OBJECT_LOCK_DAYS
        value: "35"
      # The loan documents live in the same object storage the app writes to, so the backup job
      # needs read access to copy them into the vault. A database restored without them is every
      # loan file with no paperwork. Same values as the web service.
      - key: STORAGE_PROVIDER
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        value: auto
      # Where "the backup failed" goes. A backup system that fails quietly is worse than none.
      - key: BACKUP_ALERT_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_PROVIDER
        value: auto
      - key: NOTIFY_FROM
        value: PILOT by YS Capital <notifications@yscapgroup.com>
      # The shared config generates ephemeral values and prints a SECURITY warning on every boot
      # when these are missing. The backup job verifies no tokens and decrypts no SSNs, so the
      # values only need to exist — but a real warning must never be lost in that noise.
      - key: JWT_SECRET
        sync: false
      - key: SSN_ENCRYPTION_KEY
        sync: false

  # ---------------------------------------------------------------------------
  # THE WEEKLY RESTORE DRILL.
  #
  # This is the part most backup setups skip, and it is the part that decides whether the backups
  # are real. It downloads an actual backup, decrypts it, restores it into a scratch database, and
  # compares the result table by table and row by row against what was recorded when the dump was
  # taken. If it ever disagrees, it emails.
  #
  # It needs its OWN throwaway database — it wipes the target every run, and refuses to point at
  # anything whose name does not say so. On Render: create a second, small Postgres instance named
  # e.g. `yscap-verify` and set BACKUP_VERIFY_DATABASE_URL to it. Without it the drill still proves
  # the file is intact and decrypts; it just cannot prove it LOADS.
  #
  # Sundays 08:30 UTC ≈ 4:30am New York, well after the nightly job has finished.
  # ---------------------------------------------------------------------------
  - type: cron
    name: ys-capital-backup-verify
    runtime: docker
    plan: starter
    rootDir: yscap-repo-root_8
    dockerfilePath: ./Dockerfile.backup
    schedule: "30 8 * * 0"
    dockerCommand: node scripts/backup-verify.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: yscap, property: connectionString }
      # The scratch database. EVERYTHING IN IT IS DELETED on every run — never point this at
      # anything real. The drill refuses a target that is the live database, and refuses one whose
      # name does not look disposable.
      - key: BACKUP_VERIFY_DATABASE_URL
        sync: false
      - key: BACKUP_ENCRYPTION_KEY
        sync: false
      - key: BACKUP_S3_BUCKET
        sync: false
      - key: BACKUP_S3_ENDPOINT
        sync: false
      - key: BACKUP_S3_ACCESS_KEY_ID
        sync: false
      - key: BACKUP_S3_SECRET_ACCESS_KEY
        sync: false
      - key: BACKUP_S3_REGION
        sync: false
      - key: BACKUP_ALERT_EMAIL
        sync: false
      # A PASSING drill emails too — this is the one "all good" worth reading, because it is the
      # only message in the system that proves a restore actually works.
      - key: BACKUP_ALERT_ON_SUCCESS
        value: "1"
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_PROVIDER
        value: auto
      - key: NOTIFY_FROM
        value: PILOT by YS Capital <notifications@yscapgroup.com>
      - key: JWT_SECRET
        sync: false
      - key: SSN_ENCRYPTION_KEY
        sync: false

databases:
  - name: yscap
    plan: basic-1gb
