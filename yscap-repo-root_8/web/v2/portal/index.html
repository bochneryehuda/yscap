    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>PILOT by YS Capital</title>
    <!-- Installable PWA: adds "Install PILOT" in the browser and pins it like an app. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#F7FAF9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PILOT" />
    <!-- iOS ignores SVG touch icons — the 180px PNG is what home-screen installs use. -->
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <!-- PILOT × YS Capital re-skin: Fraunces (display serif) + Hanken Grotesk (UI/body). Inter kept as fallback. -->
    <link rel="stylesheet" href="/assets/fonts/fonts.css?v=pilot-selfhost1">
    <!-- The frozen pricing engines are NOT loaded here. The portal never computed
         with them (App.jsx only logged their presence), so shipping them to the
         browser only exposed the guideline rules. Pricing is server-side
         (src/lib/pricing.js). Do NOT re-add engine script tags here. -->
    <script type="module" crossorigin src="/portal/assets/index-CvcAgAsg.js"></script>
    <link rel="stylesheet" crossorigin href="/portal/assets/index-CJgB_2Ee.css">
  </head>
